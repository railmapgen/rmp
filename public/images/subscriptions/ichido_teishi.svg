<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">一度停车</title>
  <desc id="desc">红色轮廓的正面电车与停车牌，保留原色亮红停车牌内芯。</desc>
  <style>
    svg { color: #B64C61; }
    @media (prefers-color-scheme: dark) {
      svg { color: #E8A1B1; }
    }
  </style>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Train reduced to 85% of its former size, centered in its original footprint. -->
    <g id="train" transform="translate(60.9 74.7) scale(0.85)">
    <!-- train body -->
    <rect x="128" y="172" width="556" height="572" rx="104" stroke-width="36"/>
    <rect x="210" y="298" width="392" height="196" rx="26" stroke-width="28"/>
    <rect x="320" y="224" width="172" height="34" rx="17" fill="currentColor" stroke="none"/>
    <!-- headlights -->
    <circle cx="282" cy="634" r="43" stroke-width="24" fill="#fff"/>
    <circle cx="530" cy="634" r="43" stroke-width="24" fill="#fff"/>
    <!-- rail base -->
    <path d="M168 824L242 718H568L642 824Z" stroke-width="30"/>
    <path d="M236 824L282 720" stroke-width="22"/>
    <path d="M528 720L574 824" stroke-width="22"/>
    </g>
    <!-- stop sign -->
    <rect x="756" y="316" width="162" height="288" rx="32" stroke-width="28" fill="#fff"/>
    <rect x="792" y="352" width="90" height="216" rx="14" stroke="none" fill="#ff1d25"/>
    <path d="M838 604V814" stroke-width="28"/>
    <path d="M772 814H904" stroke-width="28"/>
  </g>
</svg>
